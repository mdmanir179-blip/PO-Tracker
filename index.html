    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch;
          if (currentFetch) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (e) {}
      })();
    </script>
