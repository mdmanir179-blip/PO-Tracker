<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InstamartOps" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      (function() {
        // 1. Universal window.fetch setter compatibility
        function makeFetchWritable(target) {
          if (!target) return;
          try {
            var currentFetch = target.fetch || (typeof window !== 'undefined' ? window.fetch : null);
            Object.defineProperty(target, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e) {
            try {
              target.fetch = target.fetch;
            } catch (e2) {}
          }
        }

        makeFetchWritable(window);
        if (typeof Window !== 'undefined') {
          makeFetchWritable(Window.prototype);
        }
        try {
          if (window.__proto__) {
            makeFetchWritable(window.__proto__);
          }
        } catch (e) {}

        // 2. Global error suppressor for external extension scripts and iframe automation
        var originalOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          var str = String(msg || '') + ' ' + String(url || '') + ' ' + String(err || '');
          if (
            str.indexOf('chrome-extension') !== -1 ||
            str.indexOf('fetch of #<Window>') !== -1 ||
            str.indexOf('frame_ant') !== -1 ||
            str.indexOf('signal is aborted') !== -1
          ) {
            return true;
          }
          if (typeof originalOnError === 'function') {
            return originalOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener(
          'error',
          function(e) {
            var msg = (e && e.message) || (e && e.error && e.error.message) || String(e);
            var file = (e && e.filename) || '';
            if (
              file.indexOf('chrome-extension') !== -1 ||
              msg.indexOf('chrome-extension') !== -1 ||
              msg.indexOf('fetch of #<Window>') !== -1 ||
              msg.indexOf('frame_ant') !== -1
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function(e) {
            var reason = e && e.reason;
            var msg = (reason && (reason.message || String(reason))) || String(reason || '');
            if (
              msg.indexOf('signal is aborted') !== -1 ||
              msg.indexOf('AbortError') !== -1 ||
              msg.indexOf('fetch of #<Window>') !== -1 ||
              msg.indexOf('chrome-extension') !== -1 ||
              msg.indexOf('frame_ant') !== -1
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
    <title>Instamart PO & DN Tracker</title>
    <meta name="description" content="Enterprise Instamart Purchase Order, In-Transit, GRN, and Discrepancy Note (DN) management system with real-time Google Sheets sync and role-based access control." />
    <meta property="og:title" content="Instamart PO & DN Tracker" />
    <meta property="og:description" content="Enterprise Instamart Purchase Order, In-Transit, GRN, and Discrepancy Note (DN) management system with real-time Google Sheets sync and role-based access control." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root">
      <div id="startup-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(234, 88, 12, 0.2); border-top-color: #ea580c; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h1 style="font-size: 20px; font-weight: 700; margin: 0 0 8px 0; color: #ffffff; letter-spacing: -0.02em;">Instamart POsHub</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 16px 0; max-width: 420px; line-height: 1.5;">Initializing Purchase Order & Logistics Control Workspace...</p>
        <noscript style="color: #ef4444; font-size: 14px; font-weight: bold; margin-top: 10px;">JavaScript is required to run this application.</noscript>
        <div id="startup-diagnostic-box" style="display: none; max-width: 520px; width: 100%; background: #0f172a; border: 1px solid #ef4444; border-radius: 12px; padding: 16px; margin-top: 16px; text-align: left;">
          <div style="color: #f87171; font-weight: bold; font-size: 13px; margin-bottom: 6px;">⚠️ Startup Warning</div>
          <div id="startup-diagnostic-text" style="font-family: monospace; font-size: 11px; color: #fca5a5; max-height: 120px; overflow-y: auto; word-break: break-all;"></div>
          <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="margin-top: 12px; padding: 6px 14px; background: #ea580c; border: none; border-radius: 8px; color: #ffffff; font-weight: bold; font-size: 12px; cursor: pointer;">Clear Cache & Reload</button>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        window.addEventListener('error', function(e) {
          var msg = (e && e.error && e.error.message) || (e && e.message) || String(e);
          var file = (e && e.filename) || '';
          if (file.indexOf('chrome-extension') !== -1 || msg.indexOf('chrome-extension') !== -1 || msg.indexOf('fetch of #<Window>') !== -1) {
            return;
          }
          var box = document.getElementById('startup-diagnostic-box');
          var txt = document.getElementById('startup-diagnostic-text');
          if (box && txt) {
            box.style.display = 'block';
            txt.textContent = msg;
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (
            msg.indexOf('signal is aborted') !== -1 ||
            msg.indexOf('AbortError') !== -1 ||
            msg.indexOf('fetch of #<Window>') !== -1 ||
            msg.indexOf('chrome-extension') !== -1
          ) {
            return;
          }
          var box = document.getElementById('startup-diagnostic-box');
          var txt = document.getElementById('startup-diagnostic-text');
          if (box && txt) {
            box.style.display = 'block';
            txt.textContent = msg || 'Promise rejected';
          }
        });
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
